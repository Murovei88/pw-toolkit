version: '3.8'

networks:
  default:
    external:
      name: toolkit-network

services:
  nginx:
    image: nginx:alpine
    container_name: toolkit_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
